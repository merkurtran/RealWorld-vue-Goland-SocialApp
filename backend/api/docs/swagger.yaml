basePath: /
definitions:
  models.CommentPost:
    properties:
      value:
        type: string
    required:
    - value
    type: object
  models.CreateOrUpdatePost:
    properties:
      message:
        minLength: 5
        type: string
      selectedFile:
        type: string
      title:
        type: string
    required:
    - message
    - title
    type: object
  models.CreateUser:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      password:
        type: string
    type: object
  models.LoginUser:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  models.MessageModel:
    properties:
      _id:
        type: string
      content:
        type: string
      receiver:
        type: string
      sender:
        type: string
    type: object
  models.PostModel:
    properties:
      _id:
        type: string
      comments:
        items:
          type: string
        type: array
      createdAt:
        type: string
      creator:
        type: string
      likes:
        items:
          type: string
        type: array
      message:
        minLength: 5
        type: string
      name:
        type: string
      selectedFile:
        type: string
      title:
        type: string
    required:
    - message
    - title
    type: object
  models.SendMessageModel:
    properties:
      content:
        minLength: 5
        type: string
      receiver:
        type: string
      sender:
        type: string
    required:
    - content
    - receiver
    - sender
    type: object
  models.UpdateUser:
    properties:
      bio:
        type: string
      imageUrl:
        type: string
      name:
        type: string
    type: object
  models.UserModel:
    properties:
      _id:
        type: string
      bio:
        type: string
      email:
        type: string
      followers:
        items:
          type: string
        type: array
      following:
        items:
          type: string
        type: array
      imageUrl:
        type: string
      name:
        type: string
      password:
        minLength: 5
        type: string
    required:
    - email
    - password
    type: object
host: localhost:5005
info:
  contact: {}
  description: This is Swagger docs for rest api goland fiber
  title: Fiber Goland Mongo Grpc Websocet etc..
  version: "1.0"
paths:
  /chat/get-user-unreadedmsg:
    get:
      consumes:
      - application/json
      description: get unreaded message count & recodes for user
      parameters:
      - description: user id
        in: query
        name: userid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: get unreaded message count & recodes for user
      tags:
      - Chat
  /chat/getmsgsbynums:
    get:
      consumes:
      - application/json
      description: GetMesgsByNums two users by pagenation
      parameters:
      - description: Staring point page num
        in: query
        name: from
        required: true
        type: integer
      - description: first user id
        in: query
        name: firstuid
        required: true
        type: string
      - description: second user id
        in: query
        name: seconduid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.MessageModel'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: get message by pagenation
      tags:
      - Chat
  /chat/mark-msg-asreaded:
    get:
      consumes:
      - application/json
      description: mark messages as read for user update the recoded make is read
        true num 0
      parameters:
      - description: main user id
        in: query
        name: mainuid
        required: true
        type: string
      - description: other user id
        in: query
        name: otheruid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: mark messages as read for user
      tags:
      - Chat
  /chat/sendmessage:
    post:
      consumes:
      - application/json
      description: SendMessage from one user to another
      parameters:
      - description: user SendMessage details
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/models.SendMessageModel'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.MessageModel'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: send message to friend user
      tags:
      - Chat
  /notification/{userid}:
    get:
      consumes:
      - application/json
      description: get user notification
      parameters:
      - description: User ID
        in: path
        name: userid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: get user notification
      tags:
      - Notification
  /notification/mark-notification-asreaded:
    get:
      consumes:
      - application/json
      description: MarkNotAsReaded
      parameters:
      - description: User ID
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Mark notification asreaded for a user
      tags:
      - Notification
  /posts:
    get:
      consumes:
      - application/json
      description: get all post
      parameters:
      - description: page number
        in: query
        name: page
        type: integer
      - description: user id
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PostModel'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: get all post
      tags:
      - Posts
    post:
      consumes:
      - application/json
      description: create new post
      parameters:
      - description: post create details
        in: body
        name: post
        required: true
        schema:
          $ref: '#/definitions/models.CreateOrUpdatePost'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.PostModel'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: create a new post
      tags:
      - Posts
  /posts/{id}:
    delete:
      consumes:
      - application/json
      description: delete post by post id need to provided auth token for post creator
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: delete post by id
      tags:
      - Posts
    get:
      consumes:
      - application/json
      description: get post details
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PostModel'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: get post data
      tags:
      - Post
    patch:
      consumes:
      - application/json
      description: update post
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      - description: update post details
        in: body
        name: post
        required: true
        schema:
          $ref: '#/definitions/models.CreateOrUpdatePost'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PostModel'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: update post
      tags:
      - Posts
  /posts/{id}/commentPost:
    post:
      consumes:
      - application/json
      description: comment post
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      - description: comment value
        in: body
        name: post
        required: true
        schema:
          $ref: '#/definitions/models.CommentPost'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PostModel'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: comment post
      tags:
      - Posts
  /posts/{id}/likePost:
    patch:
      consumes:
      - application/json
      description: like post
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PostModel'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: like or unlike a post by it's id
      tags:
      - Posts
  /posts/search:
    get:
      consumes:
      - application/json
      description: get post and users matching the search query
      parameters:
      - description: Search query
        in: query
        name: searchQuery
        required: true
        type: string
      produces:
      - application/json
      responses:
