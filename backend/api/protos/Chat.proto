syntax = "proto3";

option go_package = "/protos";

service RealtimeChatService {
    rpc GetUserFollowingFollowers(UserID) returns (UserIDsListResponse){}
    rpc GetUserFollowing(MessageRequest) returns (MessageResponse){}
    rpc SendMessage(MessageRequest) returns (MessageResponse){}
}

message MessageRequest {
    string content = 1;
    string sender = 2;
    string receiver = 3;
}

message MessageResponse {
    string message = 1;
}

message UserID {
    string userid = 1;
}

message UserIDsListResponse {
    repeated UserIDsList UserIDsLists = 1;
}

message UserIDsList {
    repeated string useridsList = 1;
}